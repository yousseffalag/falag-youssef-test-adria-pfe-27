spring.application.name=chatbot-service
server.port=8083

# Select one provider with LLM_PROVIDER: google-genai (default) or openai (Mistral API).
spring.ai.model.chat=${LLM_PROVIDER:google-genai}

spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.5-flash-lite}

# Mistral's OpenAI-compatible API
spring.ai.openai.chat.api-key=${MISTRAL_API_KEY:}
spring.ai.openai.chat.base-url=${MISTRAL_BASE_URL:https://api.mistral.ai/v1}
spring.ai.openai.chat.model=${MISTRAL_MODEL:mistral-small-latest}

spring.ai.mcp.client.name=ebank-chatbot
spring.ai.mcp.client.version=1.0.0
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.streamable-http.connections.account-service.url=${ACCOUNT_MCP_URL:http://localhost:8081}
spring.ai.mcp.client.streamable-http.connections.transaction-service.url=${TRANSACTION_MCP_URL:http://localhost:8082}
